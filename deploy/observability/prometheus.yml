global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: virgo-control
    metrics_path: /internal/metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: control-host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: control-containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
