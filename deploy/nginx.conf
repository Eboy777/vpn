worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Do not log request targets: the Telegram webhook path contains a secret.
    log_format safe '$remote_addr $request_method $status $body_bytes_sent '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 200;
    large_client_header_buffers 2 8k;

    upstream vpn_control {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            limit_except GET POST OPTIONS { deny all; }
            limit_req zone=api_per_ip burst=60 nodelay;
            limit_conn connections_per_ip 30;
            proxy_pass http://vpn_control;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
