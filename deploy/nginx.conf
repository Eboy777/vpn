worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Do not log request targets: the Telegram webhook path contains a secret.
    log_format safe '$remote_addr $request_method $status $body_bytes_sent '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    client_max_body_size 1m;

    upstream vpn_control {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://vpn_control;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}

