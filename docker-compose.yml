x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "false"
  env_file:
    - path: ${VPN_ENV_FILE:-.env.example}
    - path: .env
      required: false
  restart: "no"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${VPN_ENV_FILE:-.env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Local development only; loopback binding keeps PostgreSQL off public interfaces.
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - private

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: vpn_test
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - private

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  api:
    <<: *app
    environment:
      PROCESS_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - private

  worker:
    <<: *app
    command: ["python", "-m", "vpn_service.worker.main"]
    environment:
      PROCESS_ROLE: worker
      # Local development uses the Bot API directly; production compose stays webhook-only.
      TELEGRAM_DELIVERY_MODE: ${TELEGRAM_DELIVERY_MODE:-polling}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - private

  reverse-proxy:
    image: nginx:1.30.4-alpine
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - private

  tests:
    <<: *app
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    command: ["pytest"]
    environment:
      APP_ENV: test
      PROCESS_ROLE: api
      DATABASE_URL: postgresql+asyncpg://vpn:vpn-test-only@postgres-test:5432/vpn_test
      TEST_DATABASE_URL: postgresql+asyncpg://vpn:vpn-test-only@postgres-test:5432/vpn_test
    volumes:
      - ./deploy:/app/deploy:ro
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - private

networks:
  private:
    internal: false

volumes:
  postgres_data:
