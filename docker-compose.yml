x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "false"
  env_file:
    - ${VPN_ENV_FILE:-.env.example}
  depends_on:
    postgres:
      condition: service_healthy
  restart: "no"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${VPN_ENV_FILE:-.env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Local development only; loopback binding keeps PostgreSQL off public interfaces.
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - private

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    networks:
      - private

  api:
    <<: *app
    environment:
      PROCESS_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - private

  worker:
    <<: *app
    command: ["python", "-m", "vpn_service.worker.main"]
    environment:
      PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - private

  reverse-proxy:
    image: nginx:1.30.4-alpine
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - private

  tests:
    <<: *app
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    command: ["pytest"]
    environment:
      APP_ENV: test
      PROCESS_ROLE: api
      DATABASE_URL: postgresql+asyncpg://vpn:vpn-local-only@postgres:5432/vpn
      TEST_DATABASE_URL: postgresql+asyncpg://vpn:vpn-local-only@postgres:5432/vpn
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

networks:
  private:
    internal: false

volumes:
  postgres_data:
